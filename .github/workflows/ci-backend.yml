name: CI Backend .NET

# Integración Continua: compila la solución y corre TODAS las pruebas xUnit
# en cada Pull Request hacia develop/main. Si falla, el PR no se puede fusionar.

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/services/**'
      - 'src/building-blocks/**'
      - 'src/gateway/**'
      - 'src/apps/escritorio-cajero/**'
      - 'BancoChillo.sln'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/services/**'
      - 'src/building-blocks/**'
      - 'src/gateway/**'
      - 'src/apps/escritorio-cajero/**'
      - 'BancoChillo.sln'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/ci-backend.yml'

jobs:
  compilar-y-probar:
    name: Compilar y probar (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET (versión de global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar paquetes NuGet
        run: dotnet restore BancoChillo.sln

      - name: Compilar
        run: dotnet build BancoChillo.sln --no-restore --configuration Release

      - name: Pruebas unitarias
        run: dotnet test BancoChillo.sln --no-build --configuration Release --logger "trx;LogFilePrefix=resultados" --collect:"XPlat Code Coverage"

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas-dotnet
          path: '**/TestResults/**'
          retention-days: 7
