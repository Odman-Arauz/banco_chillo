name: CI Frontend PWA

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/apps/pwa-banca/**'
      - '.github/workflows/ci-frontend-pwa.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/apps/pwa-banca/**'
      - '.github/workflows/ci-frontend-pwa.yml'

jobs:
  construir-pwa:
    name: Lint, tipos, pruebas y build web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/apps/pwa-banca

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/apps/pwa-banca/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificar tipos TypeScript
        run: npm run typecheck

      - name: Pruebas unitarias (Jest)
        run: npm test -- --ci

      - name: Build web (PWA)
        run: npm run build

      - name: Guardar build
        uses: actions/upload-artifact@v4
        with:
          name: pwa-web
          path: src/apps/pwa-banca/dist
          retention-days: 7
